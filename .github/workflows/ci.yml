name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: web + api (lint, typecheck, test, e2e, migrations, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (also generates the Prisma client)
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Prisma schema valid, migrations apply, no drift against the datamodel
        working-directory: apps/api
        run: |
          npx prisma validate
          psql "$DATABASE_URL" -c 'CREATE DATABASE ci_shadow;'
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-migrations prisma/schema/migrations \
            --to-schema-datamodel prisma/schema \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm run build

  python:
    name: workers (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/workers/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  docker:
    name: images build
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/workers/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
