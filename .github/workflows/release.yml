name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

permissions:
  contents: write
  packages: write

jobs:
  # Validate that this is a proper release
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify version matches package.json
        run: |
          TS_VERSION=$(jq -r '.version' packages/ts/package.json)
          if [[ "${{ steps.version.outputs.version }}" != "${TS_VERSION}" ]]; then
            echo "Tag version ${{ steps.version.outputs.version }} doesn't match packages/ts/package.json version ${TS_VERSION}"
            exit 1
          fi

      - name: Verify version matches pyproject.toml
        run: |
          PY_VERSION=$(grep '^version = ' packages/py/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "${{ steps.version.outputs.version }}" != "${PY_VERSION}" ]]; then
            echo "Tag version ${{ steps.version.outputs.version }} doesn't match packages/py/pyproject.toml version ${PY_VERSION}"
            exit 1
          fi

      - name: Verify CHANGELOG.md updated
        run: |
          if ! grep -q "## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "CHANGELOG.md doesn't contain entry for version ${{ steps.version.outputs.version }}"
            exit 1
          fi

  # Run full CI to ensure everything passes
  full-ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  # Build and publish TypeScript package
  publish-typescript:
    name: Publish TypeScript Package
    runs-on: ubuntu-latest
    needs: [validate-release, full-ci]
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify build
        run: |
          npm pack --dry-run
          echo "Package contents:"
          npm pack --dry-run | tail -n +2

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload TypeScript package
        uses: actions/upload-artifact@v4
        with:
          name: typescript-package-${{ needs.validate-release.outputs.version }}
          path: packages/ts/dist/

  # Build and publish Python package
  publish-python:
    name: Publish Python Package
    runs-on: ubuntu-latest
    needs: [validate-release, full-ci]
    defaults:
      run:
        working-directory: packages/py
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch twine

      - name: Build package
        run: hatch build

      - name: Verify build
        run: |
          echo "Built packages:"
          ls -la dist/
          twine check dist/*

      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "
          import summarizer_contracts
          from summarizer_contracts import validate_summarize_request_v1
          print(f'Successfully installed summarizer-contracts v{summarizer_contracts.__version__}')
          "

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.validate-release.outputs.version }}
          path: packages/py/dist/

  # Create GitHub release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, publish-typescript, publish-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download TypeScript artifacts
        uses: actions/download-artifact@v4
        with:
          name: typescript-package-${{ needs.validate-release.outputs.version }}
          path: release-artifacts/typescript/

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.validate-release.outputs.version }}
          path: release-artifacts/python/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          
          # Extract changelog section for this version
          sed -n "/## \[${VERSION}\]/,/## \[/{/## \[${VERSION}\]/p; /## \[/!p; /## \[${VERSION}\]/!d}" CHANGELOG.md > release-notes.md
          
          # Remove the first line (version header) and last line (next version header if exists)
          if [[ $(wc -l < release-notes.md) -gt 2 ]]; then
            sed -i '1d; $d' release-notes.md
          else
            sed -i '1d' release-notes.md
          fi
          
          echo "changelog_file=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.validate-release.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: ${{ needs.validate-release.outputs.is_prerelease }}
          files: |
            release-artifacts/typescript/*
            release-artifacts/python/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-release verification
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    needs: [validate-release, create-github-release]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wait for npm registry propagation
        run: sleep 60

      - name: Test TypeScript package installation from npm
        run: |
          npm install @summarizer/contracts@${{ needs.validate-release.outputs.version }}
          node -e "
          const { validateSummarizeRequestV1 } = require('@summarizer/contracts');
          console.log('✓ TypeScript package installed and imports correctly');
          "

      - name: Wait for PyPI propagation  
        run: sleep 60

      - name: Test Python package installation from PyPI
        run: |
          pip install summarizer-contracts==${{ needs.validate-release.outputs.version }}
          python -c "
          from summarizer_contracts import validate_summarize_request_v1
          print('✓ Python package installed and imports correctly')
          "

      - name: Verify GitHub release created
        run: |
          curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ needs.validate-release.outputs.version }}" | \
          jq -r '.name' | grep -q "Release v${{ needs.validate-release.outputs.version }}" && \
          echo "✓ GitHub release created successfully"

  # Notify success
  notify-success:
    name: Notify Release Success
    runs-on: ubuntu-latest
    needs: [validate-release, verify-release]
    if: always() && needs.verify-release.result == 'success'
    steps:
      - name: Summary
        run: |
          echo "🎉 Release v${{ needs.validate-release.outputs.version }} completed successfully!"
          echo ""
          echo "Published packages:"
          echo "- TypeScript: @summarizer/contracts@${{ needs.validate-release.outputs.version }}"
          echo "- Python: summarizer-contracts==${{ needs.validate-release.outputs.version }}"
          echo ""
          echo "Installation:"
          echo "- npm install @summarizer/contracts@${{ needs.validate-release.outputs.version }}"
          echo "- pip install summarizer-contracts==${{ needs.validate-release.outputs.version }}"