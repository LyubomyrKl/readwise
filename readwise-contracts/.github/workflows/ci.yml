name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Schema validation job
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ajv-cli for schema validation
        run: npm install -g ajv-cli@5

      - name: Validate common schema
        run: ajv validate -s schemas/\$defs/common.v1.schema.json --spec=draft2020

      - name: Validate event schemas
        run: |
          ajv validate -s schemas/events/summarize.request.v1.schema.json -r schemas/\$defs/common.v1.schema.json --spec=draft2020
          ajv validate -s schemas/events/summary.completed.v1.schema.json -r schemas/\$defs/common.v1.schema.json --spec=draft2020
          ajv validate -s schemas/events/summary.failed.v1.schema.json -r schemas/\$defs/common.v1.schema.json --spec=draft2020

  # OpenAPI validation job
  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install OpenAPI validators
        run: |
          npm install -g @stoplight/spectral-cli
          npm install -g swagger-parser

      - name: Validate OpenAPI spec syntax
        run: swagger-parser validate openapi/gateway.v1.yaml

      - name: Lint OpenAPI spec
        run: spectral lint openapi/gateway.v1.yaml --format stylish --verbose

  # TypeScript package job
  typescript:
    name: TypeScript Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Test package build
        run: npm pack --dry-run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: packages/ts/dist/

  # Python package job
  python:
    name: Python Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: packages/py
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Install package in development mode
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v

      - name: Build package
        run: hatch build

      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "import summarizer_contracts; print('Package imports successfully')"

      - name: Upload build artifacts (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/py/dist/

  # Integration tests across packages
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download TypeScript artifacts
        uses: actions/download-artifact@v4
        with:
          name: typescript-dist
          path: packages/ts/dist/

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: packages/py/dist/

      - name: Install packages
        run: |
          # Install TypeScript package
          cd packages/ts
          npm ci
          npm run build
          cd ../..
          
          # Install Python package
          cd packages/py
          pip install dist/*.whl
          cd ../..

      - name: Test fixture validation consistency
        run: |
          # Test that both TS and Python validate the same fixtures consistently
          cd packages/ts
          npm test
          cd ../py
          pytest tests/ -v

      - name: Cross-validate fixtures
        run: |
          # Test that valid fixtures pass in both languages
          # and invalid fixtures fail in both languages
          echo "Testing fixture consistency between TypeScript and Python packages..."
          python -c "
          import json
          import os
          from pathlib import Path
          from summarizer_contracts import validate_summarize_request_v1
          
          # Test valid fixtures
          valid_dir = Path('tests/fixtures/valid')
          for fixture in valid_dir.glob('summarize-request*.json'):
              with open(fixture) as f:
                  data = json.load(f)
              try:
                  validate_summarize_request_v1(data)
                  print(f'✓ {fixture.name} validates in Python')
              except Exception as e:
                  print(f'✗ {fixture.name} failed in Python: {e}')
                  exit(1)
          
          # Test invalid fixtures  
          invalid_dir = Path('tests/fixtures/invalid')
          for fixture in invalid_dir.glob('summarize-request*.json'):
              with open(fixture) as f:
                  data = json.load(f)
              try:
                  validate_summarize_request_v1(data)
                  print(f'✗ {fixture.name} should have failed in Python')
                  exit(1)
              except:
                  print(f'✓ {fixture.name} correctly failed in Python')
          "

  # Security and quality checks
  security-checks:
    name: Security & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          # Node.js security
          npm install -g npm-audit-resolver
          
          # Python security
          pip install safety bandit

      - name: Audit TypeScript dependencies
        working-directory: packages/ts
        run: |
          npm ci
          npm audit --audit-level moderate

      - name: Check Python dependencies for vulnerabilities
        working-directory: packages/py
        run: |
          pip install -e .
          safety check

      - name: Run Python security linting
        working-directory: packages/py
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            packages/py/bandit-report.json