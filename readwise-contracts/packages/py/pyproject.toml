[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "summarizer-contracts"
version = "1.0.0"
description = "Python validators and schemas for Summarizer system contracts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Summarizer Team"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["summarizer", "validation", "json-schema", "contracts"]
requires-python = ">=3.8"
dependencies = [
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/summarizer_contracts"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""