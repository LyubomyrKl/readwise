services:
  summarizer-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: summarizer-gateway
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

    env_file:
      - .env
    networks:
      - summarizer_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  summarizer_net:
    external: true
    name: summarizer_net
