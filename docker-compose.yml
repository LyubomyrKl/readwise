version: "3.9"

services:
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: summarizer-workers
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
