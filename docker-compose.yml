# Workbench: the whole stack on one host.
#   cp .env.example .env   (fill in the secrets)
#   docker compose up -d --build
# Local full-stack run with published ports: add -f docker-compose.dev.yml (see that file).
# Every container has rotated logs and a memory and CPU limit (*_MEM_LIMIT, *_CPUS in .env), so no
# single one can starve Postgres; the defaults suit a 4-8 GB host with at least 2 CPUs.
name: workbench

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Object storage and the broker: what the API and the workers both use.
x-shared-env: &shared-env
  S3_HOST: minio
  S3_PORT: "9000"
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_REGION: us-east-1
  S3_BOOK_BUCKET_NAME: books
  S3_BOOK_COVER_BUCKET_NAME: covers
  S3_SUMMARIES_BUCKET_NAME: summaries
  S3_EXTRACTIONS_BUCKET_NAME: extractions
  S3_CHECKPOINTS_BUCKET_NAME: checkpoints
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}

# The API's environment: the shared part plus Postgres. The workers never touch the database, so
# they get none of this.
x-app-env: &app-env
  <<: *shared-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workbench}?schema=public
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-workbench}

services:
  db:
    image: postgres:16
    container_name: workbench-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-2}
    logging: *logging
    restart: unless-stopped

  minio:
    # MinIO withdrew its images from Docker Hub and quay.io in 2025. This tag resolves to the image
    # already present on the host (RELEASE.2025-07-23T15-54-02Z there). For a new host, copy it over:
    #   docker save minio/minio:latest | ssh <host> docker load
    # or move to another S3-compatible server (see the plan's risks).
    image: minio/minio:latest
    pull_policy: missing
    container_name: workbench-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    cpus: ${MINIO_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  # Creates the buckets once; safe to re-run.
  minio-init:
    image: minio/minio:latest
    pull_policy: missing
    container_name: workbench-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/books local/covers local/extractions local/summaries local/checkpoints
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    cpus: ${MINIO_CPUS:-1}
    logging: *logging
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: workbench-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    cpus: ${RABBITMQ_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  # One-shot: applies Prisma migrations before the applications start.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: workbench-api
    container_name: workbench-migrate
    command: ["node", "/repo/node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workbench}?schema=public
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-1}
    logging: *logging
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: workbench-api
    container_name: workbench-api
    environment:
      <<: *app-env
      NODE_ENV: production
      PORT: "5173"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # api | worker | all: HTTP, queue consumers + job sweep, or both (one host: both)
      APP_MODE: ${APP_MODE:-all}
      JOBS_LEASE_SECONDS: ${JOBS_LEASE_SECONDS:-900}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # who may sign up: first-user (only while there is no account), open, closed
      REGISTRATION: ${REGISTRATION:-first-user}
      # the API description at /api/docs (off in production unless on)
      SWAGGER: ${SWAGGER:-off}
      # largest accepted upload (a book or a cover), in bytes; it is held in memory while stored,
      # so keep it well under API_MEM_LIMIT
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-209715200}
      # passkeys: the site as the browser sees it (host name and origin)
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost}
      # money tool: daily rates, prices, recurring movements and quarterly snapshots
      MONEY_TIMEZONE: ${MONEY_TIMEZONE:-Europe/Warsaw}
      MONEY_SCHEDULER: ${MONEY_SCHEDULER:-on}
    ports:
      # loopback only: for host tools such as scripts/smoke-summary.sh; the public entry point is Caddy
      - "127.0.0.1:${API_PORT:-5173}:5173"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    image: workbench-workers
    container_name: workbench-workers
    environment:
      <<: *shared-env
      RABBITMQ_HEARTBEAT: "0"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL in .env}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:?set OLLAMA_EMBED_MODEL in .env}
      PIPELINE_MODE: ${PIPELINE_MODE:-balanced}
      WORKER_ID: workers
      WORKER_QUEUES: reader
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    mem_limit: ${WORKERS_MEM_LIMIT:-1536m}
    cpus: ${WORKERS_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: workbench-web
    container_name: workbench-web
    environment:
      NODE_ENV: production
      API_URL: http://api:5173
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: workbench-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  # Optional: docker compose --profile backup up -d
  backup:
    image: postgres:16
    container_name: workbench-backup
    profiles: ["backup"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - ./infra/backup/restore-check.sh:/restore-check.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    healthcheck:
      # unhealthy while the newest verified dump is older than BACKUP_MAX_AGE_HOURS
      test: ["CMD", "/bin/sh", "/backup.sh", "check"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 1h
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-1}
    logging: *logging
    restart: unless-stopped

  # Off-server copy of the dumps (profile backup) to the rclone remote "offsite", which must be
  # of type crypt (offsite.sh refuses anything else): see .env.example. Only these variables
  # reach the container, not the rest of .env.
  backup-offsite:
    image: rclone/rclone:1.68.2
    container_name: workbench-backup-offsite
    profiles: ["backup"]
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_OFFSITE_HOUR_UTC: ${BACKUP_OFFSITE_HOUR_UTC:-3}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_REMOTE: ${RCLONE_CONFIG_OFFSITE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_PASSWORD: ${RCLONE_CONFIG_OFFSITE_PASSWORD:-}
      RCLONE_CONFIG_OFFSITE_PASSWORD2: ${RCLONE_CONFIG_OFFSITE_PASSWORD2:-}
    volumes:
      - ./infra/backup/offsite.sh:/offsite.sh:ro
      - backups:/backups:ro
    entrypoint: ["/bin/sh", "/offsite.sh"]
    depends_on:
      - backup
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-1}
    logging: *logging
    restart: unless-stopped

volumes:
  pg:
  minio:
  rabbitmq:
  caddy_data:
  caddy_config:
  backups:

networks:
  default:
    name: workbench_net
