# docker-compose.yml
services:
  worker-text:
    build: .
    environment:
      AMQP_URL: amqp://user:pass@rabbitmq:5672/
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: /
      RABBITMQ_USER: user
      RABBITMQ_PASS: pass
    depends_on:
      - rabbitmq
      - postgres
    networks: [summarizer_net]
networks:
  summarizer_net:
    external: true
