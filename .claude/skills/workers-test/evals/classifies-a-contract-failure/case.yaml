schema_version: "1.1"
name: classifies-a-contract-failure
expected_outcome: |
  The answer says the failure is in the contracts, not the worker code and not Docker: the
  valid fixture envelope.extract.json under packages/contracts/jobs/fixtures carries a field
  (priority) that the pydantic mirror apps/workers/worker/platform/contracts.py forbids
  (extra inputs are not permitted), so either the schema and fixture gained a field the mirror
  must learn or the fixture is wrong. It names the schema
  packages/contracts/jobs/job-envelope.schema.json and the zod mirror
  apps/api/src/platform/jobs/contracts.ts (contracts.spec.ts) as the other places that must
  agree, so the fix lands on the right side. It does not run pytest or pip with the host
  Python and does not edit any file, because the user only asked what broke.
