[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-workers"
version = "0.2.0"
description = "Workbench background workers: a job consumer plus the reader tool's handlers (extract, ingest, summarize, abridge)"
requires-python = ">=3.11"
dependencies = [
  # messaging, storage, configuration
  "pika==1.3.2",
  "boto3==1.34.28",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.0.0",
  "python-dotenv==1.0.0",
  "httpx>=0.25,<1",
  # the reader: EPUB parsing (beautifulsoup4) and writing (ebooklib), pictures (Pillow)
  "Pillow==10.1.0",
  "ebooklib==0.18",
  "beautifulsoup4==4.12.2",
  # PDF structure, fonts, pictures, page rendering for OCR (AGPL, self-hosted use)
  "pymupdf==1.28.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
worker = "worker.__main__:main"

[tool.setuptools.packages.find]
include = ["worker*"]
