[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-workers"
version = "0.1.0"
description = "Workbench background workers: document extraction and LLM summarization"
requires-python = ">=3.11"
dependencies = [
  # messaging, storage, database
  "pika==1.3.2",
  "prisma==0.11.0",
  "python-dotenv==1.0.0",
  "boto3==1.34.28",
  "pydantic-settings>=2.0.0",
  "httpx>=0.25,<1",
  # extraction
  "pdfplumber==0.10.3",
  "pytesseract==0.3.10",
  "Pillow==10.1.0",
  "ebooklib==0.18",
  "beautifulsoup4==4.12.2",
  # summarization pipeline
  "tiktoken==0.5.2",
  "numpy>=1.21.0",
  "scipy>=1.7.0",
  "scikit-learn>=1.0.0",
  "nltk>=3.6.0",
  "requests>=2.25.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["shared"]
